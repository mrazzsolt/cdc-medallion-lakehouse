name: cdc-medallion

services:
  # =========================
  # 1) ORACLE XE (Source OLTP database)
  # =========================
  oracle:
    # Community-maintained Oracle XE image — no Oracle registry login required
    image: gvenzl/oracle-xe:21
    container_name: oracle
    restart: unless-stopped

    # ORACLE_PASSWORD: required; sets the SYS/SYSTEM user password
    # APP_USER + APP_USER_PASSWORD: optional; creates an application schema automatically
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}

    # Expose Oracle listener port to the host (e.g. for SQL Developer access)
    ports:
      - "1521:1521"

    # Named volume: database files persist across container restarts/removals
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/$ORACLE_PASSWORD@//localhost:1521/XEPDB1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # =========================
  # 2) KAFKA (Event streaming bus)
  # =========================
  kafka:
    image: apache/kafka:3.7.0 
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Creating DLQ topics...' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.cdc.APP.CUSTOMERS --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.cdc.APP.ORDERS --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.cdc.APP.PRODUCTS --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.cdc.APP.PRODUCT_CATEGORIES --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.cdc.APP.PRODUCTS_X_CATEGORY --partitions 1 --replication-factor 1 &&
      echo 'DLQ topics created.'
      "
    restart: "no"


  # =========================
  # 3) KAFKA CONNECT (Debezium runtime)
  # =========================
  connect:
    # Debezium's pre-built Kafka Connect image with CDC connectors included
    build:
      context: ./debezium
      dockerfile: Dockerfile.connect
    container_name: connect
    restart: unless-stopped

    # Wait for Kafka to be up before starting Connect
    depends_on:
      kafka:
        condition: service_started
      oracle:
        condition: service_healthy

    # REST API port — used to register/manage connectors (e.g. curl or Postman)
    ports:
      - "8083:8083"

    environment:
      # Connect to our Kafka broker
      BOOTSTRAP_SERVERS: "kafka:9092"

      # Unique ID for this Connect cluster (acts like a consumer group ID)
      GROUP_ID: "connect-cluster-1"

      # Internal Kafka topics where Connect stores its own configs, offsets and status
      CONFIG_STORAGE_TOPIC: "connect-configs"
      OFFSET_STORAGE_TOPIC: "connect-offsets"
      STATUS_STORAGE_TOPIC: "connect-status"

      # Single-node setup: replication factor 1 is enough
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      # Use JSON for now (Avro + Schema Registry can be added later)
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  connector-init:
    image: curlimages/curl:latest
    container_name: connector-init
    depends_on:
      connect:
        # Only start after connect passes its healthcheck
        condition: service_healthy
      python-simulator:
        # Ensure the simulator has started and can connect to Oracle before registering the connector
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Kafka Connect is healthy. Running register-connector.sh...' &&
        sh /scripts/register-connector.sh &&
        echo 'Done.'
      "
    volumes:
      - ./scripts/register-connector.sh:/scripts/register-connector.sh:ro
      - ./debezium/connector-config.json:/config/connector-config.json:ro
    restart: "no"

  # =========================
  # 4) KAFKA UI (browser-based topic inspector)
  # =========================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      # Register our local Kafka cluster so it shows up in the UI
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"

  # =========================
  # 5) MINIO (S3-compatible Data Lake storage)
  # =========================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    # Start the object storage server; expose the web console on port 9001
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"  # S3 API — used by Python consumer (boto3)
      - "9001:9001"  # Web console — open in browser

    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================
  # 6) MINIO INIT (one-shot bucket creator)
  # =========================
  minio-init:
    # MinIO Client (mc) image — runs once, creates the bucket, then exits
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} || true &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET}'
      "
    # This container should run once and not restart
    restart: "no"
  # =========================
  # 7) PYTHON PRODUCER
  # =========================
  python-seed:
    build:
      context: ./python
      dockerfile: Dockerfile.producer
    container_name: python-seed
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      ORACLE_DSN: ${ORACLE_DSN}
    command: ["python", "producer/seed.py"]
    restart: "no"

  python-simulator:
    build:
      context: ./python
      dockerfile: Dockerfile.producer
    container_name: python-simulator
    depends_on:
      python-seed:
        condition: service_completed_successfully
      oracle:
        condition: service_healthy
    environment:
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      ORACLE_DSN: ${ORACLE_DSN}
    command: ["python", "producer/simulate.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import oracledb, os; oracledb.connect(user=os.environ['APP_USER'], password=os.environ['APP_USER_PASSWORD'], dsn=os.environ['ORACLE_DSN'])"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # =========================
  # 8) AVRO SCHEMA REGISTRY
  # =========================    

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # schema-init:
  #   image: curlimages/curl:latest
  #   container_name: schema-init
  #   depends_on:
  #     schema-registry:
  #       condition: service_healthy
  #   volumes:
  #     - ./schemas/avro:/schemas
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       echo "Registering Avro schemas..."
    
  #       for schema in customers orders products product_categories products_x_category; do
  #         table=$$(echo $$schema | tr '[:lower:]' '[:upper:]')
  #         echo "Registering $$table..."
  #         SCHEMA_CONTENT=$$(cat /schemas/$${schema}.avsc | tr -d '\n\r' | sed 's/\"/\\\"/g')
  #         PAYLOAD="{\"schema\": \"$$SCHEMA_CONTENT\"}"
  #         curl -sf -X POST http://schema-registry:8081/subjects/cdc.APP.$${table}-value/versions \
  #           -H "Content-Type: application/vnd.schemaregistry.v1+json" \
  #           -d "$$PAYLOAD" \
  #           && echo "$$table OK" || echo "$$table FAILED"
  #       done
    
  #       echo "Schema registration done."

  #   restart: "no"

  # =========================
  # 9) BRONZE WRITER (Python Kafka consumer + MinIO producer)
  # =========================    
  bronze-writer:
    build:
      context: ./python
      dockerfile: Dockerfile.consumer
    container_name: bronze-writer
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: unless-stopped

  # =========================
  # 10) DLQ HANDLER (Python consumer for failed messages in the dead letter queue)
  # =========================  

  dlq-handler:
    build:
      context: ./python
      dockerfile: Dockerfile.dlq
    container_name: dlq-handler
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: datalake
    networks:
      - default
    restart: unless-stopped
  # =========================
  # 11) TEST RUNNER
  # =========================
  test-runner:
    build:
      context: ./python
      dockerfile: Dockerfile.test
    container_name: test-runner
    profiles:
      - test
    restart: "no"
  # =========================
  # 12) ERROR SIMULATOR (DLQ teszteléshez)
  # =========================
  python-error-simulator:
    build:
      context: ./python
      dockerfile: Dockerfile.error-simulator
    container_name: python-error-simulator
    depends_on:
      kafka:
        condition: service_healthy
      python-seed:
        condition: service_completed_successfully
      oracle:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    command: ["python", "producer/error_simulator.py"]
    #profiles:
    #  - error-sim
    restart: "no"



volumes:
  oracle_data:   # Oracle datafiles
  kafka_data:    # Kafka log segments
  minio_data:    # MinIO object data
