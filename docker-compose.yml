name: cdc-medallion

services:
  # =========================
  # 1) ORACLE XE (Source OLTP database)
  # =========================
  oracle:
    # Community-maintained Oracle XE image — no Oracle registry login required
    image: gvenzl/oracle-xe:21
    container_name: oracle
    restart: unless-stopped

    # ORACLE_PASSWORD: required; sets the SYS/SYSTEM user password
    # APP_USER + APP_USER_PASSWORD: optional; creates an application schema automatically
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}

    # Expose Oracle listener port to the host (e.g. for SQL Developer access)
    ports:
      - "1521:1521"

    # Named volume: database files persist across container restarts/removals
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Basic healthcheck — Oracle readiness is better tracked via logs on first start
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo 'ping'"]
      interval: 30s
      timeout: 10s
      retries: 10

  # =========================
  # 2) KAFKA (Event streaming bus)
  # =========================
  kafka:
    image: apache/kafka:3.7.0 
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data


  # =========================
  # 3) KAFKA CONNECT (Debezium runtime)
  # =========================
  connect:
    # Debezium's pre-built Kafka Connect image with CDC connectors included
    image: quay.io/debezium/connect:3.1.0.Final
    container_name: connect
    restart: unless-stopped

    # Wait for Kafka to be up before starting Connect
    depends_on:
      - kafka

    # REST API port — used to register/manage connectors (e.g. curl or Postman)
    ports:
      - "8083:8083"

    environment:
      # Connect to our Kafka broker
      BOOTSTRAP_SERVERS: "kafka:9092"

      # Unique ID for this Connect cluster (acts like a consumer group ID)
      GROUP_ID: "connect-cluster-1"

      # Internal Kafka topics where Connect stores its own configs, offsets and status
      CONFIG_STORAGE_TOPIC: "connect-configs"
      OFFSET_STORAGE_TOPIC: "connect-offsets"
      STATUS_STORAGE_TOPIC: "connect-status"

      # Single-node setup: replication factor 1 is enough
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      # Use JSON for now (Avro + Schema Registry can be added later)
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  # =========================
  # 4) KAFKA UI (browser-based topic inspector)
  # =========================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      # Register our local Kafka cluster so it shows up in the UI
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"

  # =========================
  # 5) MINIO (S3-compatible Data Lake storage)
  # =========================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    # Start the object storage server; expose the web console on port 9001
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"  # S3 API — used by Python consumer (boto3)
      - "9001:9001"  # Web console — open in browser

    volumes:
      - minio_data:/data

  # =========================
  # 6) MINIO INIT (one-shot bucket creator)
  # =========================
  minio-init:
    # MinIO Client (mc) image — runs once, creates the bucket, then exits
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} || true &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET}'
      "
    # This container should run once and not restart
    restart: "no"

volumes:
  oracle_data:   # Oracle datafiles
  kafka_data:    # Kafka log segments
  minio_data:    # MinIO object data
